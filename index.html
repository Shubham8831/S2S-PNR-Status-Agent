<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway PNR Voice Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 40, 85, 0.92), rgba(100, 30, 30, 0.88)),
                        url('https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=1920') center/cover;
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 60px 20px 80px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #e67e50, #d4915a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(230, 126, 80, 0.3);
            font-size: 36px;
            font-weight: bold;
            color: white;
        }

        h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }

        .subtitle {
            color: #ffd700;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.18);
            animation: fadeInUp 0.8s ease;
        }

        .session-badge {
            background: rgba(100, 200, 100, 0.2);
            border: 1px solid rgba(100, 200, 100, 0.4);
            border-radius: 20px;
            padding: 6px 12px;
            color: #90ee90;
            font-size: 12px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .session-badge.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .mic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 100%;
        }

        .mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e67e50, #d4915a);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(230, 126, 80, 0.4);
            position: relative;
        }

        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 50px rgba(230, 126, 80, 0.6);
        }

        .mic-button:active {
            transform: scale(0.95);
        }

        .mic-button.recording {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            animation: pulse 1.5s infinite;
        }

        .mic-button.processing {
            background: linear-gradient(135deg, #5b8fc4, #3d6ca3);
            cursor: not-allowed;
        }

        .mic-button.speaking {
            background: linear-gradient(135deg, #10b981, #059669);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 10px 40px rgba(220, 38, 38, 0.5);
            }
            50% {
                box-shadow: 0 10px 60px rgba(220, 38, 38, 0.9);
            }
        }

        .mic-icon {
            font-size: 48px;
            color: white;
        }

        .status-text {
            color: white;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
            min-height: 28px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
            margin-top: 5px;
        }

        .language-badge {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 20px;
            padding: 8px 16px;
            color: #ffd700;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .language-badge.visible {
            display: inline-block;
        }

        .status-details {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-top: 15px;
            color: #ffd700;
            font-size: 14px;
            line-height: 1.8;
            max-height: none;
            width: 100%;
            overflow-y: visible;
            display: none;
        }

        .status-details.visible {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
            margin: 10px auto;
        }

        .loader.visible {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .footer {
            position: relative;
            margin-top: 40px;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .footer-note {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            line-height: 1.6;
        }

        .error-message {
            background: rgba(220, 38, 38, 0.3);
            border: 1px solid rgba(220, 38, 38, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin-top: 15px;
            width: 100%;
            color: #fecaca;
            font-size: 14px;
            line-height: 1.6;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .error-message.visible {
            display: block;
        }

        .conversation-history-container {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
            width: 100%;
            max-width: 100%;
        }

        .clear-history-btn {
            background: rgba(220, 38, 38, 0.3);
            border: 1px solid rgba(220, 38, 38, 0.5);
            color: #fecaca;
            padding: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s ease;
        }

        .clear-history-btn:hover {
            background: rgba(220, 38, 38, 0.5);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="background"></div>
   
    <div class="container">
        <div class="header">
            <div class="logo">🚂</div>
            <h1>Indian Railway</h1>
            <p class="subtitle">AI Voice Assistant with Context Memory</p>
        </div>

        <div class="card">
            <div class="session-badge" id="sessionBadge">
                🔄 Session Active • PNR: <span id="sessionPnr">-</span>
            </div>

            <div class="mic-container">
                <button class="mic-button" id="micButton">
                    <span class="mic-icon">🎤</span>
                </button>
               
                <div class="status-text" id="statusText">
                    Click to speak your PNR or ask a question
                </div>

                <div class="language-badge" id="languageBadge"></div>

                <div class="loader" id="loader"></div>
               
                <div class="status-details" id="statusDetails"></div>
                <div class="error-message" id="errorMessage"></div>

                <div class="conversation-history-container">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <div style="color: #ffd700; font-size: 14px; font-weight: 600;">💬 Conversation</div>
                        <button onclick="clearSession()" class="clear-history-btn">Clear Session</button>
                    </div>
                    <div id="conversationHistory">
                        <div style="color: rgba(255,255,255,0.5); font-size: 13px;">No conversation yet</div>
                    </div>
                </div>
            </div>
        </div>

        
    </div>

    <audio id="responseAudio" style="display: none;"></audio>

    <script>
        const API_BASE = 'http://localhost:8000';
       
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let isProcessing = false;
        let isSpeaking = false;
        let detectedLanguage = 'english';
        let sessionId = 'user_' + Date.now();
        let conversationHistory = [];

        const micButton = document.getElementById('micButton');
        const statusText = document.getElementById('statusText');
        const statusDetails = document.getElementById('statusDetails');
        const errorMessage = document.getElementById('errorMessage');
        const loader = document.getElementById('loader');
        const responseAudio = document.getElementById('responseAudio');
        const languageBadge = document.getElementById('languageBadge');
        const sessionBadge = document.getElementById('sessionBadge');
        const sessionPnr = document.getElementById('sessionPnr');

        function updateStatus(text) {
            statusText.textContent = text;
        }

        function showLanguageBadge(lang) {
            const langNames = {
                'hindi': 'हिंदी', 'english': 'English', 'tamil': 'தமிழ்',
                'telugu': 'తెలుగు', 'bengali': 'বাংলা', 'marathi': 'मराठी',
                'gujarati': 'ગુજરાતી', 'kannada': 'ಕನ್ನಡ', 'malayalam': 'മലയാളം',
                'punjabi': 'ਪੰਜਾਬੀ', 'urdu': 'اردو'
            };
           
            languageBadge.textContent = `🌐 ${langNames[lang] || lang}`;
            languageBadge.classList.add('visible');
            detectedLanguage = lang;
        }

        function updateSessionBadge(pnr) {
            if (pnr) {
                sessionPnr.textContent = pnr;
                sessionBadge.classList.add('active');
            }
        }

        function showLoader() {
            loader.classList.add('visible');
        }

        function hideLoader() {
            loader.classList.remove('visible');
        }

        function showError(text) {
            errorMessage.textContent = text;
            errorMessage.classList.add('visible');
            statusDetails.classList.remove('visible');
        }

        function hideError() {
            errorMessage.classList.remove('visible');
        }

        function showDetails(text) {
            statusDetails.innerHTML = text.replace(/\n/g, '<br>');
            statusDetails.classList.add('visible');
            errorMessage.classList.remove('visible');
        }

        function displayConversationHistory() {
            const historyContainer = document.getElementById('conversationHistory');
            if (!conversationHistory.length) {
                historyContainer.innerHTML = '<div style="color: rgba(255,255,255,0.5); font-size: 13px;">No conversation yet</div>';
                return;
            }

            let historyHTML = '<div style="max-height: 250px; overflow-y: auto;">';
            conversationHistory.slice(-5).reverse().forEach((item, index) => {
                historyHTML += `
                    <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 12px;">
                        <div style="color: rgba(255,255,255,0.9); margin-bottom: 4px;">👤 "${item.user}"</div>
                        <div style="color: rgba(100,200,100,0.9); margin-top: 4px;">🤖 ${item.assistant.substring(0, 100)}${item.assistant.length > 100 ? '...' : ''}</div>
                    </div>
                `;
            });
            historyHTML += '</div>';
            historyContainer.innerHTML = historyHTML;
        }

        async function clearSession() {
            if (confirm('Clear session and start fresh?')) {
                // Stop any playing audio
                if (responseAudio.src && !responseAudio.paused) {
                    responseAudio.pause();
                    responseAudio.currentTime = 0;
                }
                
                try {
                    await fetch(`${API_BASE}/clear_session?session_id=${sessionId}`, {
                        method: 'POST'
                    });
                } catch (error) {
                    console.log('Session clear error:', error);
                }
                
                conversationHistory = [];
                sessionId = 'user_' + Date.now();
                sessionBadge.classList.remove('active');
                displayConversationHistory();
                updateStatus('Session cleared. Click to speak your PNR');
                statusDetails.classList.remove('visible');
                languageBadge.classList.remove('visible');
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    stream.getTracks().forEach(track => track.stop());
                    await processVoiceInput(recordedAudioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                micButton.classList.add('recording');
                updateStatus('🔴 Recording... Click to stop');
            } catch (error) {
                showError('❌ Microphone access denied. Please allow microphone access.');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                micButton.classList.remove('recording');
                micButton.classList.add('processing');
                updateStatus('Processing...');
                showLoader();
            }
        }

        function stopAudioPlayback() {
            if (responseAudio.src && !responseAudio.paused) {
                responseAudio.pause();
                responseAudio.currentTime = 0;
                isSpeaking = false;
                micButton.classList.remove('speaking');
            }
        }

        async function processVoiceInput(audioBlob) {
            isProcessing = true;

            try {
                updateStatus('🎧 Processing your voice...');
               
                const formData = new FormData();
                formData.append('audio', audioBlob, 'audio.webm');
                formData.append('session_id', sessionId);

                const response = await fetch(`${API_BASE}/unified_voice_input`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
               
                if (!data.success) {
                    throw new Error(data.error || 'Failed to process request');
                }

                // Update UI
                showLanguageBadge(data.detected_language);
                
                if (data.pnr) {
                    updateSessionBadge(data.pnr);
                }

                // Display response
                let detailsHTML = `🗣️ You said: "${data.transcribed_text}"<br><br>`;
                
                if (data.pnr_data && data.pnr_data.data) {
                    const pnrInfo = data.pnr_data.data;
                    detailsHTML += `🎫 PNR: ${data.pnr}<br>`;
                    detailsHTML += `🚂 Train: ${pnrInfo.trainName || 'N/A'} (${pnrInfo.trainNumber || 'N/A'})<br>`;
                    detailsHTML += `📍 ${pnrInfo.sourceStation || 'N/A'} → ${pnrInfo.destinationStation || 'N/A'}<br>`;
                    detailsHTML += `📅 Date: ${pnrInfo.dateOfJourney || 'N/A'}<br><br>`;
                }

                if (data.response) {
                    detailsHTML += `🤖 Response:<br>${data.response.replace(/\n/g, '<br>')}`;
                }

                showDetails(detailsHTML);

                // Add to conversation history
                conversationHistory.push({
                    user: data.transcribed_text,
                    assistant: data.response
                });
                displayConversationHistory();

                // Convert to speech
                if (data.response) {
                    updateStatus('🔊 Converting to speech...');
                   
                    const ttsResponse = await fetch(`${API_BASE}/text_to_speech`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: data.response,
                            language: data.detected_language
                        })
                    });

                    if (!ttsResponse.ok) {
                        throw new Error('Text-to-speech failed');
                    }

                    const audioBlob = await ttsResponse.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                   
                    responseAudio.src = audioUrl;
                    await responseAudio.play();
                    
                    isSpeaking = true;
                    micButton.classList.remove('processing');
                    micButton.classList.add('speaking');
                    updateStatus(`🔊 Speaking... Click to interrupt`);
                   
                    responseAudio.onended = () => {
                        isSpeaking = false;
                        micButton.classList.remove('speaking');
                        updateStatus('✅ Click to ask another question');
                        isProcessing = false;
                    };
                } else {
                    updateStatus('✅ Click to continue');
                    micButton.classList.remove('processing');
                    isProcessing = false;
                }

            } catch (error) {
                console.error('Error:', error);
                showError(`❌ ${error.message}`);
                micButton.classList.remove('processing', 'speaking');
                isProcessing = false;
            } finally {
                hideLoader();
            }
        }

        micButton.addEventListener('click', () => {
            // Priority 1: If speaking, interrupt
            if (isSpeaking) {
                stopAudioPlayback();
                updateStatus('🛑 Interrupted. Click to speak again');
                setTimeout(() => {
                    updateStatus('Click to speak');
                    isProcessing = false;
                }, 1500);
                return;
            }

            // Priority 2: If processing (not recording), ignore
            if (isProcessing && !isRecording) {
                return;
            }

            // Priority 3: Normal recording toggle
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        window.addEventListener('beforeunload', () => {
            if (responseAudio.src) {
                URL.revokeObjectURL(responseAudio.src);
            }
        });

        displayConversationHistory();
    </script>
</body>
</html>
